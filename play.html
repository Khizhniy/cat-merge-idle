<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cat Merge IDLE: play free</title>
<meta name="description" content="Merge cute cats and collect all 114! Play free in Telegram or right in your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cat Merge IDLE: merge cats, collect all 114 🐾">
<meta property="og:description" content="Free cozy cat game. Play in Telegram or right in your browser.">
<meta property="og:image" content="https://khizhniy.github.io/cat-merge-idle/og_en.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFE7CC">
<link rel="icon" href="img/logo.jpg">
<script src="tg-config.js"></script>
<style>
:root{--bg1:#FFF4E4;--bg2:#FFE0CC;--bg3:#F3CFE6;--ink:#3A2A52;--mut:#7A5A6A;--tg:#2AABEE;--tg2:#1C8AC7;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Trebuchet MS",sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% 0%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;}
main{max-width:460px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.head{display:flex;align-items:center;gap:14px;align-self:stretch;justify-content:center}
.head img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 20px rgba(80,40,30,.25)}
h1{margin:0;font-size:30px;line-height:1.05;font-weight:900;color:#5A2D82;text-align:left}
h1 span{color:#FF8A2A}
.tag{margin:4px 0 0;color:var(--mut);font-weight:700;font-size:15px;text-align:left}
.phone{margin:18px 0 16px;width:min(62vw,250px);aspect-ratio:9/16;border-radius:30px;overflow:hidden;border:6px solid #fff;box-shadow:0 18px 40px rgba(80,40,30,.28);background:#f6e3cf}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.feats span{background:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;text-decoration:none;border-radius:20px;padding:16px 18px;font-weight:900;font-size:19px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn small{display:block;font-weight:700;font-size:12.5px;opacity:.85;margin-top:2px}
.tg{background:var(--tg);color:#fff;box-shadow:0 6px 0 var(--tg2),0 14px 28px rgba(28,138,199,.35)}
.tg svg{width:34px;height:34px;flex:none}
.web{margin-top:14px;background:#fff;color:var(--ink);border:3px solid #5A2D82;box-shadow:0 5px 0 #5A2D82}
.web .ic{font-size:26px}
.note{margin-top:16px;color:var(--mut);font-size:13px;line-height:1.45}
.note a{color:var(--tg2);font-weight:700}
.lang{position:fixed;top:10px;right:10px;font-size:13px;font-weight:800;background:rgba(255,255,255,.8);border-radius:999px;padding:5px 10px;color:var(--ink);text-decoration:none}
@media (min-width:760px){ main{padding-top:40px} }
</style>
</head>
<body>
<a class="lang" id="lang" href="#">RU</a>
<main>
  <div class="head">
    <img src="img/logo.jpg" alt="">
    <div><h1>Cat Merge <span>IDLE</span></h1><p class="tag" id="tag"></p></div>
  </div>
  <div class="phone"><video id="vid" autoplay muted loop playsinline preload="metadata"></video></div>
  <div class="feats" id="feats"></div>
  <a class="btn tg" id="tgBtn" href="#">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M21.4 3.6 2.9 10.7c-1.3.5-1.3 1.2-.2 1.6l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.4zM8.3 13.4l9.6-6.1c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4-1.6-4.9z"/></svg>
    <div><span id="tgT"></span><small id="tgS"></small></div>
  </a>
  <a class="btn web" id="webBtn" href="#"><span class="ic">🌐</span><div><span id="webT"></span><small id="webS"></small></div></a>
  <p class="note" id="note"></p>
</main>
<script>
(function(){
  // ===== Настройки =====
  // Ссылка «Играть в браузере». Пусто — откроется версия с этого же сайта (без рекламы, прогресс хранится в браузере).
  // Когда игра выйдет на Playgama или CrazyGames, вставьте сюда ссылку на её страницу — там реклама приносит доход.
  var WEB_URL = "https://playgama.ai/play/6jgglwbjea";
  var C = window.TG_CONFIG || {};
  var BOT = C.bot || "CatMergeIdle_Bot", APP = C.app || "play";

  var q = new URLSearchParams(location.search);
  var src = (q.get("s") || q.get("src") || "landing").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 32) || "landing";
  var RU = ["ru","uk","be","kk","uz","ky","tg","hy","az"];
  var lang = q.get("lang") || ((RU.indexOf(String(navigator.language || "").slice(0,2).toLowerCase()) >= 0) ? "ru" : "en");
  if (/_ru$/.test(src) && !q.get("lang")) lang = "ru";
  if (/_en$/.test(src) && !q.get("lang")) lang = "en";

  var T = {
    ru: { tag:"Соединяй котиков — собери все 114!", feats:["🐱 114 котиков","🌍 5 миров","🎁 Подарки каждый день","💤 Доход, даже когда не играешь"],
          tg:"Играть в Telegram", tgs:"бесплатно · без скачивания", web:"Играть в браузере", webs:"если нет Telegram",
          note:'Нет Telegram? <a href="https://telegram.org/apps" target="_blank" rel="noopener">Скачать бесплатно</a> или играйте в браузере.', sw:"EN" },
    en: { tag:"Merge cute cats and collect all 114!", feats:["🐱 114 cats","🌍 5 worlds","🎁 Daily gifts","💤 Earn while you're away"],
          tg:"Play in Telegram", tgs:"free · no download", web:"Play in browser", webs:"no Telegram needed",
          note:'No Telegram? <a href="https://telegram.org/apps" target="_blank" rel="noopener">Get it free</a> or play right in your browser.', sw:"RU" }
  }[lang];
  document.documentElement.lang = lang;
  var $ = function(id){ return document.getElementById(id); };
  $("tag").textContent = T.tag; $("tgT").textContent = T.tg; $("tgS").textContent = T.tgs; $("webT").textContent = T.web; $("webS").textContent = T.webs; $("note").innerHTML = T.note;
  $("feats").innerHTML = T.feats.map(function(f){ return "<span>" + f + "</span>"; }).join("");
  var v = $("vid"); v.poster = "poster_" + lang + ".jpg"; v.src = "clip_" + lang + ".mp4";
  var sw = $("lang"); sw.textContent = T.sw; q.set("lang", lang === "ru" ? "en" : "ru"); sw.href = "?" + q.toString();

  var tgUrl = "https://t.me/" + BOT + "/" + APP + "?startapp=" + encodeURIComponent(src);
  $("tgBtn").href = tgUrl;
  $("webBtn").href = WEB_URL || "./";

  // учёт переходов (без личных данных): просмотр страницы и нажатия кнопок по метке источника
  function track(ev){
    if (!C.stats) return;
    var body = JSON.stringify({src: src, ev: ev, lang: lang});
    var url = String(C.stats).replace(/\/+$/, "") + "/l";
    try{ if (navigator.sendBeacon && navigator.sendBeacon(url, body)) return; }catch(e){}
    try{ fetch(url, {method:"POST", body: body, keepalive:true, mode:"no-cors"}); }catch(e){}
  }
  track("view");
  $("tgBtn").addEventListener("click", function(){ track("tg"); });
  $("webBtn").addEventListener("click", function(){ track("web"); });
})();
</script>
</body>
</html>
